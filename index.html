<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔧 UCHIHA • V7 - ĐANG BẢO TRÌ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ====== RESET & BASE ====== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', 'Segoe UI', monospace;
            overflow: hidden;
            position: relative;
        }

        /* ====== MATRIX BACKGROUND ====== */
        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            background: #0a0a0a;
            overflow: hidden;
        }

        #matrix-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 255, 65, 0.03) 2px,
                    rgba(0, 255, 65, 0.03) 4px
                );
            animation: matrixScan 8s linear infinite;
        }

        @keyframes matrixScan {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }

        /* ====== MATRIX RAIN ====== */
        #matrix-rain {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            opacity: 0.15;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #00ff41;
            overflow: hidden;
            pointer-events: none;
        }

        .rain-column {
            position: absolute;
            top: -100%;
            animation: rainFall linear infinite;
            white-space: nowrap;
            letter-spacing: 2px;
            opacity: 0.6;
        }

        @keyframes rainFall {
            0% { transform: translateY(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(110vh); opacity: 0; }
        }

        /* ====== MAIN CONTAINER ====== */
        .main-container {
            position: relative;
            z-index: 1;
            max-width: 500px;
            width: 90%;
            padding: 20px;
        }

        /* ====== CARD ====== */
        .maintenance-card {
            background: rgba(10, 10, 10, 0.92);
            border: 1px solid #00ff41;
            border-radius: 8px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 
                0 0 40px rgba(0, 255, 65, 0.1),
                inset 0 0 40px rgba(0, 255, 65, 0.05);
            position: relative;
            overflow: hidden;
        }

        .maintenance-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 255, 65, 0.03) 0%, transparent 70%);
            animation: glowPulse 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes glowPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        /* ====== SCANLINE ====== */
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(0deg,
                transparent,
                transparent 3px,
                rgba(0, 255, 65, 0.02) 3px,
                rgba(0, 255, 65, 0.02) 4px
            );
            pointer-events: none;
            animation: scanlineMove 3s linear infinite;
            border-radius: 8px;
        }

        @keyframes scanlineMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }

        /* ====== CORNER DECORATIONS ====== */
        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: #00ff41;
            border-style: solid;
            border-width: 0;
            opacity: 0.6;
        }

        .corner-tl {
            top: 8px;
            left: 8px;
            border-top-width: 2px;
            border-left-width: 2px;
        }

        .corner-tr {
            top: 8px;
            right: 8px;
            border-top-width: 2px;
            border-right-width: 2px;
        }

        .corner-bl {
            bottom: 8px;
            left: 8px;
            border-bottom-width: 2px;
            border-left-width: 2px;
        }

        .corner-br {
            bottom: 8px;
            right: 8px;
            border-bottom-width: 2px;
            border-right-width: 2px;
        }

        /* ====== CONTENT ====== */
        .icon-main {
            font-size: 60px;
            color: #00ff41;
            margin-bottom: 20px;
            display: block;
            animation: iconPulse 2s ease-in-out infinite;
            text-shadow: 0 0 40px rgba(0, 255, 65, 0.3);
            position: relative;
            z-index: 1;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(5deg); }
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            color: #00ff41;
            letter-spacing: 4px;
            text-shadow: 0 0 30px rgba(0, 255, 65, 0.3);
            position: relative;
            z-index: 1;
            font-family: 'Courier New', monospace;
        }

        .title .v7 {
            font-size: 16px;
            color: #00ccff;
            text-shadow: 0 0 20px rgba(0, 204, 255, 0.3);
        }

        .title .cursor {
            animation: blinkText 1s infinite;
        }

        @keyframes blinkText {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .sub-title {
            font-size: 14px;
            color: #888;
            margin: 10px 0 25px;
            letter-spacing: 3px;
            position: relative;
            z-index: 1;
            font-family: 'Courier New', monospace;
        }

        .sub-title .highlight {
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        /* ====== PROGRESS BAR ====== */
        .progress-container {
            margin: 25px 0 20px;
            position: relative;
            z-index: 1;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #555;
            margin-bottom: 6px;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }

        .progress-label .percent {
            color: #00ff41;
        }

        .progress-bar {
            width: 100%;
            height: 3px;
            background: #1a1a1a;
            border-radius: 2px;
            overflow: hidden;
            border: 1px solid #1a1a1a;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ff41, #00ccff);
            border-radius: 2px;
            animation: progressLoad 4s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
        }

        @keyframes progressLoad {
            0% { width: 0%; }
            50% { width: 75%; }
            70% { width: 85%; }
            100% { width: 95%; }
        }

        /* ====== STATUS MESSAGES ====== */
        .status-messages {
            margin: 15px 0 20px;
            text-align: left;
            position: relative;
            z-index: 1;
        }

        .status-line {
            font-size: 11px;
            color: #555;
            padding: 4px 0;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
            animation: statusFade 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-line .prompt {
            color: #00ff41;
            opacity: 0.5;
        }

        .status-line .done {
            color: #00ff41;
        }

        .status-line .processing {
            color: #ffd700;
            animation: blinkText 1s infinite;
        }

        .status-line .error {
            color: #ff6b6b;
        }

        @keyframes statusFade {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ====== AUTHOR ====== */
        .author {
            margin: 20px 0 10px;
            padding-top: 20px;
            border-top: 1px solid #1a1a1a;
            position: relative;
            z-index: 1;
        }

        .author-name {
            font-size: 16px;
            font-weight: 700;
            color: #00ff88;
            letter-spacing: 3px;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
            font-family: 'Courier New', monospace;
        }

        .author-sub {
            font-size: 10px;
            color: #333;
            margin-top: 4px;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
        }

        .author-sub .heart {
            color: #ff6b6b;
            animation: heartBeat 1.5s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* ====== FOOTER ====== */
        .footer-text {
            font-size: 9px;
            color: #222;
            margin-top: 20px;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
            font-family: 'Courier New', monospace;
        }

        .footer-text .blink {
            animation: blinkText 1.5s infinite;
        }

        /* ====== RESPONSIVE ====== */
        @media (max-width: 480px) {
            .maintenance-card {
                padding: 30px 20px;
            }

            .title {
                font-size: 22px;
                letter-spacing: 2px;
            }

            .icon-main {
                font-size: 45px;
            }

            .sub-title {
                font-size: 12px;
                letter-spacing: 2px;
            }

            .author-name {
                font-size: 14px;
            }

            .status-line {
                font-size: 10px;
            }
        }

        @media (max-width: 360px) {
            .maintenance-card {
                padding: 20px 15px;
            }

            .title {
                font-size: 18px;
            }

            .icon-main {
                font-size: 35px;
            }
        }

        /* ====== GLITCH EFFECT ====== */
        .glitch {
            animation: glitch 3s infinite;
        }

        @keyframes glitch {
            0%, 90%, 100% { opacity: 1; transform: none; }
            92% { opacity: 0.8; transform: translateX(-2px); }
            94% { opacity: 1; transform: translateX(2px); }
            96% { opacity: 0.8; transform: translateX(-1px); }
            98% { opacity: 1; transform: translateX(1px); }
        }

        /* ====== FLOATING PARTICLES ====== */
        .particle {
            position: fixed;
            width: 2px;
            height: 2px;
            background: #00ff41;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            animation: particleFloat linear infinite;
        }

        @keyframes particleFloat {
            0% {
                opacity: 0;
                transform: translateY(0) translateX(0) scale(0);
            }
            10% {
                opacity: 0.5;
                transform: translateY(-20px) translateX(10px) scale(1);
            }
            90% {
                opacity: 0.5;
            }
            100% {
                opacity: 0;
                transform: translateY(-100vh) translateX(-20px) scale(0);
            }
        }
    </style>
</head>
<body>
    <!-- ====== MATRIX BACKGROUND ====== -->
    <div id="matrix-bg"></div>

    <!-- ====== MATRIX RAIN ====== -->
    <div id="matrix-rain"></div>

    <!-- ====== FLOATING PARTICLES ====== -->
    <div id="particles"></div>

    <!-- ====== MAIN CONTENT ====== -->
    <div class="main-container">
        <div class="maintenance-card">
            <div class="scanline"></div>

            <!-- Corners -->
            <div class="corner corner-tl"></div>
            <div class="corner corner-tr"></div>
            <div class="corner corner-bl"></div>
            <div class="corner corner-br"></div>

            <!-- Content -->
            <div style="position: relative; z-index: 1;">
                <i class="fas fa-code icon-main glitch"></i>

                <div class="title">
                    ⚡ UCHIHA <span class="v7">v7</span><span class="cursor">_</span>
                </div>

                <div class="sub-title">
                    <span class="highlight">⟡</span> SYSTEM MAINTENANCE <span class="highlight">⟡</span>
                </div>

                <!-- Progress -->
                <div class="progress-container">
                    <div class="progress-label">
                        <span>UPGRADING TO V7</span>
                        <span class="percent" id="percentDisplay">73%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>

                <!-- Status Messages -->
                <div class="status-messages" id="statusMessages">
                    <div class="status-line">
                        <span class="prompt">></span>
                        <span>Initializing quantum kernel...</span>
                        <span class="done">✓</span>
                    </div>
                    <div class="status-line">
                        <span class="prompt">></span>
                        <span>Loading V7 modules...</span>
                        <span class="processing">●</span>
                    </div>
                </div>

                <!-- Author -->
                <div class="author">
                    <div class="author-name">✦ NGUYEN TIEN HOC ✦</div>
                    <div class="author-sub">
                        <span class="heart">♥</span> PLEASE WAIT <span class="heart">♥</span>
                    </div>
                </div>

                <!-- Footer -->
                <div class="footer-text">
                    <span class="blink">⟡</span> SYSTEM UPGRADE IN PROGRESS <span class="blink">⟡</span><br>
                    <span style="color:#1a1a1a; font-size:8px;">v7.0 • HACKER EDITION • © 2026</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // MATRIX RAIN
        // ============================================
        function createMatrixRain() {
            const container = document.getElementById('matrix-rain');
            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ!@#$%^&*()_+-=';
            const numColumns = Math.floor(window.innerWidth / 20);

            for (let i = 0; i < numColumns; i++) {
                const col = document.createElement('div');
                col.className = 'rain-column';
                const length = Math.floor(Math.random() * 20) + 10;
                let text = '';
                for (let j = 0; j < length; j++) {
                    text += chars[Math.floor(Math.random() * chars.length)];
                    if (j < length - 1) text += ' ';
                }
                col.textContent = text;
                col.style.left = (i * 20) + 'px';
                col.style.fontSize = (Math.random() * 8 + 10) + 'px';
                col.style.animationDuration = (Math.random() * 15 + 10) + 's';
                col.style.animationDelay = (Math.random() * 20) + 's';
                container.appendChild(col);
            }
        }

        createMatrixRain();

        // ============================================
        // FLOATING PARTICLES
        // ============================================
        function createParticles() {
            const container = document.getElementById('particles');
            const count = 30;

            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 8 + 6) + 's';
                particle.style.animationDelay = (Math.random() * 8) + 's';
                particle.style.width = (Math.random() * 3 + 1) + 'px';
                particle.style.height = particle.style.width;
                container.appendChild(particle);
            }
        }

        createParticles();

        // ============================================
        // PROGRESS BAR SIMULATION
        // ============================================
        let progress = 0;
        const progressFill = document.getElementById('progressFill');
        const percentDisplay = document.getElementById('percentDisplay');
        const statusMessages = document.getElementById('statusMessages');

        const statusSteps = [
            { text: 'Initializing quantum kernel...', done: true },
            { text: 'Loading V7 modules...', done: false },
            { text: 'Configuring hacker interface...', done: false },
            { text: 'Optimizing performance...', done: false },
            { text: 'Loading VIP features...', done: false },
            { text: 'Finalizing system upgrade...', done: false },
        ];

        let currentStep = 1;

        function updateProgress() {
            progress += Math.random() * 2 + 0.5;
            if (progress > 95) progress = 95;

            progressFill.style.width = progress + '%';
            percentDisplay.textContent = Math.floor(progress) + '%';

            // Update status messages
            const stepIndex = Math.floor(progress / 16);
            if (stepIndex < statusSteps.length && stepIndex >= currentStep) {
                currentStep = stepIndex;
                const step = statusSteps[stepIndex];
                if (step) {
                    const newLine = document.createElement('div');
                    newLine.className = 'status-line';
                    newLine.innerHTML = `
                        <span class="prompt">></span>
                        <span>${step.text}</span>
                        <span class="${step.done ? 'done' : 'processing'}">${step.done ? '✓' : '●'}</span>
                    `;
                    statusMessages.appendChild(newLine);
                    statusMessages.scrollTop = statusMessages.scrollHeight;
                }
            }

            if (progress < 95) {
                setTimeout(updateProgress, 300 + Math.random() * 400);
            } else {
                // Almost done
                setTimeout(() => {
                    progressFill.style.width = '100%';
                    percentDisplay.textContent = '100%';

                    // Add final status
                    const finalLine = document.createElement('div');
                    finalLine.className = 'status-line';
                    finalLine.innerHTML = `
                        <span class="prompt">></span>
                        <span style="color:#00ff41;">System upgrade complete! Ready for V7</span>
                        <span class="done">✓</span>
                    `;
                    statusMessages.appendChild(finalLine);

                    // Flash effect
                    document.querySelector('.maintenance-card').style.borderColor = '#00ff41';
                    document.querySelector('.maintenance-card').style.boxShadow =
                        '0 0 60px rgba(0, 255, 65, 0.2), inset 0 0 60px rgba(0, 255, 65, 0.1)';

                }, 500);
            }
        }

        // Start progress after 1 second
        setTimeout(updateProgress, 1000);

        // ============================================
        // RESIZE HANDLER
        // ============================================
        window.addEventListener('resize', () => {
            const container = document.getElementById('matrix-rain');
            container.innerHTML = '';
            createMatrixRain();
        });

        // ============================================
        // CONSOLE MESSAGE
        // ============================================
        console.log('⚡ UCHIHA V7 - SYSTEM MAINTENANCE ⚡');
        console.log('👨‍💻 MAKE BY NGUYEN TIEN HOC');
        console.log('⏳ Upgrading to V7... Please wait!');
        console.log('📱 Zalo: 0987201932');
    </script>
</body>
</html>
